<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/static/css/bootstrap.rtl.min.css" />
    <title>Product-detail</title>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row ">
        <div class="col-md-5">
         {% if product.image_url %}
                <img class="card-img-top object-fit-cover" src="{{ product.image_url }}" alt="{{ product.title }}" style="height: width: 100%; height: 350px;" onerror="this.onerror=null; this.src='/static/images/default-product.png'" />
              {% else %}
                <img class="card-img-top object-fit-cover" src="/static/images/default-product.png" alt="Default product image" style="width: 100%; height: 350px;" />
              {% endif %}
        </div>
        <div class="col-md-7">
          <h1>{{ product.title }}</h1>

          <p>{{ product.description }}</p>

          <h4>{{ product.price }} تومان</h4>
          <div class="card mt-4">
            <div class="card-body">
              <h5 class="card-title">{{ product.restaurant.title }}</h5>
              <p class="card-text">{{ product.restaurant.address }}</p>
              <a href="{{ product.restaurant.menu_url }}" class="btn btn-outline-primary rounded-pill">مشاهده منوی رستوران</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
