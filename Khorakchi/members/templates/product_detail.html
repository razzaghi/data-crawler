<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product-detail</title>
  </head>
  <body>
    <h1>{{ product.title }}</h1>
    <p>{{ product.description }}</p>
    <p>Price: {{ product.price }}</p>
    {% comment %} <p>Restaurant: {{ product.restaurant.name }}</p> {% endcomment %}
    <div>
      <h3>{{ product.restaurant.title }}</h3>
      <p>{{ product.restaurant.address }}</p>
      <a href="{{ product.restaurant.menu_url }}"><img src="{{ product.image_url }}" alt="{{ product.title }}" /></a>
    </div>
  </body>
</html>
