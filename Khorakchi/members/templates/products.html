<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
  </head>
  <body>
    <h1>Search Result</h1>
    <div>
      {% for product in products %}
        <div>
          <h3><a href="{% url 'product_detail' product.id %}">
            {{ product.title }}
          </a></h3>
          <p>{{ product.price }}</p>
        </div>
      {% empty %}
        <p>No products found.</p>
      {% endfor %}
    </div>
    <div>
      {% if products.has_previous %}
        <a href="?food={{ food }}&city={{ city }}&page={{ products.previous_page_number }}">Previous</a>
      {% endif %}

      <span>{{ products.number }} / {{ products.paginator.num_pages }}</span>

      {% if products.has_next %}
        <a href="?food={{ food }}&city={{ city }}&page={{ products.next_page_number }}">Next</a>
      {% endif %}
    </div>
  </body>
</html>
